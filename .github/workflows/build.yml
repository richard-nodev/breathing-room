name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and build
        shell: cmd
        run: build.cmd package

      - name: Upload the release zip
        uses: actions/upload-artifact@v4
        with:
          name: BreathingRoom
          path: |
            dist/*.zip
            dist/*.sha256
