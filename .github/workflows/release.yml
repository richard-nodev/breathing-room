name: Release

# Push a tag like v1.0.0 to build, test and publish a GitHub release with the zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and build
        shell: cmd
        run: build.cmd package

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Use this version's section of the changelog as the release notes.
          $log = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\].*?\r?\n(.*?)(?=^## \[|\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $files = (Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' }).FullName
          gh release create $tag @files --title "Breathing Room $version" --notes-file release-notes.md
